name: Development release

on:
  push:
    tags: ["dev-v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: read
  id-token: write

jobs:
  integration:
    uses: ./.github/workflows/integration.yml

  development-release:
    needs: integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@06832c7b30a0129d7fb559bcc6e43d26f6374244 # v4
        with:
          validate-wrappers: true
      - name: Require development tag
        run: |
          test "${GITHUB_REF_TYPE}" = tag
          test "${GITHUB_REF_NAME}" = "dev-v$(python3 -c 'import json; print(json.load(open("modules.json"))["distributionVersion"])')"
      - name: Build development artifacts
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          ./gradlew --no-daemon
          -PdevelopmentApiBaseUrl=http://127.0.0.1:8000
          spotlessCheck detekt check lintDevelopment assembleDevelopment bundleDevelopment
      - name: Verify and describe artifacts
        run: |
          python3 scripts/verify_development_artifact_signing.py \
            --apksigner "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" \
            --apk app/build/outputs/apk/development/app-development.apk \
            --aab app/build/outputs/bundle/development/app-development.aab
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/bundletool.jar" \
            https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar
          echo "a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  $RUNNER_TEMP/bundletool.jar" | sha256sum --check --strict
          java -jar "$RUNNER_TEMP/bundletool.jar" validate --bundle app/build/outputs/bundle/development/app-development.aab
          mkdir -p development-release
          python3 scripts/generate_release_metadata.py --manifest modules.json --revision "$GITHUB_SHA" --metadata development-release/component-metadata.json
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          output-file: development-release/sbom.spdx.json
      - name: Generate checksums
        run: sha256sum app/build/outputs/apk/development/app-development.apk app/build/outputs/bundle/development/app-development.aab app/build/outputs/mapping/development/mapping.txt development-release/component-metadata.json development-release/sbom.spdx.json > development-release/SHA256SUMS
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            app/build/outputs/apk/development/app-development.apk
            app/build/outputs/bundle/development/app-development.aab
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          prerelease: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            app/build/outputs/apk/development/app-development.apk
            app/build/outputs/bundle/development/app-development.aab
            app/build/outputs/mapping/development/mapping.txt
            development-release/SHA256SUMS
            development-release/component-metadata.json
            development-release/sbom.spdx.json
