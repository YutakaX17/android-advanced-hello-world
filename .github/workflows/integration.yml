name: Integration

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 2"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  backend-device:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: android-advanced-hello-world
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: YutakaX17/advanced-hello-world-be-core
          ref: 5095d868c3cc1a5eafb834270ad35e0e4f8c8237
          path: advanced-hello-world-be-core
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: YutakaX17/advanced-hello-world-be-messages
          ref: f1d49ba400e7eea7d8ebfe71b6977b9f3e156abc
          path: advanced-hello-world-be-messages
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: YutakaX17/advanced-hello-world-be
          ref: 2d94cc694bd5f1396d08ea600f547fcd0068d655
          path: advanced-hello-world-be
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: advanced-hello-world-be/pyproject.toml
      - name: Install and start backend
        working-directory: advanced-hello-world-be
        env:
          DJANGO_SECRET_KEY: integration-only-secret
          DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost,10.0.2.2
          CORS_ALLOWED_ORIGINS: http://localhost
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_DB: advanced_hello_world
          POSTGRES_USER: advanced_hello_world
          POSTGRES_PASSWORD: integration-password
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pip install --no-deps ../advanced-hello-world-be-core ../advanced-hello-world-be-messages
          python -c 'import advanced_hello_world_core.module, advanced_hello_world_messages.module'
          python -m advanced_hello_world.module_manifest modules.json --check-installed
          docker run --name advanced-hello-world-e2e-db --health-cmd 'pg_isready -U advanced_hello_world -d advanced_hello_world' --health-interval 2s --health-retries 30 -e POSTGRES_DB=advanced_hello_world -e POSTGRES_USER=advanced_hello_world -e POSTGRES_PASSWORD=integration-password -p 5432:5432 -d postgres:17.5-alpine
          until [ "$(docker inspect --format='{{.State.Health.Status}}' advanced-hello-world-e2e-db)" = healthy ]; do sleep 2; done
          python manage.py migrate
          nohup python manage.py runserver 0.0.0.0:8000 > backend.log 2>&1 &
          until curl --fail --silent http://127.0.0.1:8000/api/v1/health/live; do sleep 2; done
      - uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@06832c7b30a0129d7fb559bcc6e43d26f6374244 # v4
        with:
          validate-wrappers: true
      - name: Run backend-to-device synchronization journey
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          working-directory: android-advanced-hello-world
          script: ./gradlew --no-daemon connectedDebugAndroidTest
      - name: Capture diagnostics
        if: failure()
        run: |
          adb logcat -d > android-logcat.txt || true
          docker logs advanced-hello-world-e2e-db > postgres.log 2>&1 || true
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        if: failure()
        with:
          name: backend-device-e2e-diagnostics
          path: |
            android-advanced-hello-world/app/build/reports/androidTests/
            android-logcat.txt
            advanced-hello-world-be/backend.log
            postgres.log
